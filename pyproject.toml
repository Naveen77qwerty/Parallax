[project]
name = "dispersion-barbell"
version = "0.1.0"
description = "Autonomous options agent for the Alpaca AI Trading Agents Hackathon: short rich single-name premium via defined-risk spreads, long cheap index convexity."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "google-genai>=1.0",   # catalyst_gate.py + structure_agent.py — the two decisions with real veto/sizing power
    "openai>=1.50",   # points at Featherless's OpenAI-compatible endpoint, headline_triage.py only
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "tenacity>=9.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "freezegun>=1.5"]
dashboard = ["streamlit>=1.39", "plotly>=5.24"]

[project.scripts]
barbell = "barbell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/barbell"]

[tool.hatch.build.targets.editable]
packages = ["src/barbell"]

[tool.ruff]
line-length = 100
